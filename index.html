<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>초성게임</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    input, button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ddd;
      margin-top: 10px;
    }

    button {
      border: none;
      background: #333;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #ccc;
    }

    .hidden {
      display: none;
    }

    .question {
      text-align: center;
      font-size: 48px;
      font-weight: bold;
      margin: 25px 0;
      letter-spacing: 8px;
    }

    .answer {
      text-align: center;
      font-size: 20px;
      margin: 15px 0;
    }

    .ranking {
      line-height: 1.8;
      font-size: 17px;
    }

    .winner {
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      margin: 15px 0;
    }

    .small {
      color: #777;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- 시작 화면 -->
  <div id="startScreen" class="card">
    <h1>🔤 초성게임</h1>

    <input
      id="nameInput"
      type="text"
      placeholder="이름을 입력하세요"
      maxlength="10"
    >

    <button onclick="joinGame()">게임 참가</button>

    <p class="small">
      이름을 입력하고 게임에 참가해주세요.
    </p>
  </div>


  <!-- 참가자 화면 -->
  <div id="playerScreen" class="hidden">

    <div class="card">
      <h2 id="playerWelcome"></h2>

      <div class="small">
        진행자가 문제를 시작하면 초성이 나타납니다.
      </div>

      <div id="playerQuestion" class="question">
        준비중
      </div>

      <input
        id="answerInput"
        type="text"
        placeholder="정답을 입력하세요"
        autocomplete="off"
      >

      <button id="submitButton" onclick="submitAnswer()">
        정답 제출
      </button>

      <div id="submitMessage" class="small"></div>
    </div>

    <div class="card">
      <h3>🏆 현재 순위</h3>
      <div id="playerRanking" class="ranking">
        아직 점수가 없습니다.
      </div>
    </div>

  </div>


  <!-- 진행자 화면 -->
  <div id="hostScreen" class="hidden">

    <div class="card">

      <h1>🎤 진행자 화면</h1>

      <div id="questionNumber">
        문제 준비
      </div>

      <div id="hostQuestion" class="question">
        -
      </div>

      <div id="hostAnswer" class="answer">
        정답: -
      </div>

      <div id="winner" class="winner">
        -
      </div>

      <button onclick="nextQuestion()">
        ▶ 다음 문제
      </button>

      <button onclick="showAnswer()">
        👀 정답 보기
      </button>

    </div>


    <div class="card">

      <h3>👥 참가자</h3>

      <div id="participants">
        아직 참가자가 없습니다.
      </div>

    </div>


    <div class="card">

      <h3>🏆 현재 순위</h3>

      <div id="hostRanking" class="ranking">
        아직 점수가 없습니다.
      </div>

    </div>

  </div>

</div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getDatabase,
    ref,
    set,
    get,
    onValue,
    push,
    runTransaction
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


  // Firebase 설정
  const firebaseConfig = {

    apiKey: "AIzaSyAWLUTCM2SqdaDCQB_XNS4uoZK-qhSHtIg",

    authDomain:
      "workshop-chosung.firebaseapp.com",

    databaseURL:
      "https://workshop-chosung-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
      "workshop-chosung",

    storageBucket:
      "workshop-chosung.firebasestorage.app",

    messagingSenderId:
      "574056053091",

    appId:
      "1:574056053091:web:8ca2f88db16bd737a4fb56"

  };


  const app = initializeApp(firebaseConfig);

  const db = getDatabase(app);


  // 초성 문제
  const questions = [

    { q: "ㅊㅋ", a: "치킨" },
    { q: "ㅍㅈ", a: "피자" },
    { q: "ㄸㅂㅇ", a: "떡볶이" },
    { q: "ㄱㅂ", a: "김밥" },
    { q: "ㅇㅇㅋ", a: "아메리카노" },
    { q: "ㅋㅍ", a: "캠핑" },
    { q: "ㅎㅋㅅ", a: "호캉스" },
    { q: "ㅎㅇ", a: "해외여행" },
    { q: "ㅂㄷ", a: "바다" },
    { q: "ㅅ", a: "산" },
    { q: "ㄴㅈㅈ", a: "늦잠" },
    { q: "ㅇㅅㅈ", a: "아이스크림" },
    { q: "ㄴㄹㅂ", a: "노래방" },
    { q: "ㅇㅎㄱ", a: "영화관" },
    { q: "ㅂㄹㅇ", a: "볼링" },
    { q: "ㅇㅅ", a: "여행" },
    { q: "ㅁㅅㅌㅂ", a: "맛집탐방" },
    { q: "ㄴㅍㄹ", a: "넷플릭스" },
    { q: "ㅅㅈ", a: "사진" },
    { q: "ㅂㅅㄱ", a: "비상금" }

  ];


  let playerName = "";
  let playerId = "";
  let currentQuestion = -1;
  let answered = false;


  // 참가
  window.joinGame = async function() {

    const name =
      document.getElementById("nameInput").value.trim();

    if (!name) {
      alert("이름을 입력해주세요.");
      return;
    }

    playerName = name;

    playerId =
      name + "_" + Date.now();


    await set(
      ref(db, "players/" + playerId),
      {
        name: playerName,
        score: 0
      }
    );


    document.getElementById("startScreen")
      .classList.add("hidden");

    document.getElementById("playerScreen")
      .classList.remove("hidden");

    document.getElementById("playerWelcome")
      .innerText =
      playerName + "님 환영합니다!";


    listenGame();

  };


  // 게임 상태 감시
  function listenGame() {

    onValue(
      ref(db, "game"),
      snapshot => {

        const data = snapshot.val();

        if (!data) return;


        currentQuestion =
          data.currentQuestion ?? -1;


        if (currentQuestion >= 0) {

          document.getElementById("playerQuestion")
            .innerText =
            questions[currentQuestion].q;

        } else {

          document.getElementById("playerQuestion")
            .innerText =
            "준비중";

        }


        answered = false;

        document.getElementById("answerInput")
          .value = "";

        document.getElementById("submitMessage")
          .innerText = "";

        document.getElementById("submitButton")
          .disabled = false;

      }
    );


    onValue(
      ref(db, "players"),
      snapshot => {

        const players = snapshot.val();

        if (!players) return;

        const sorted =
          Object.values(players)
            .sort((a,b) => b.score - a.score);


        let html = "";

        sorted.forEach((p, index) => {

          html +=
            `${index + 1}위 ${p.name} — ${p.score}점<br>`;

        });


        document.getElementById("playerRanking")
          .innerHTML = html;

      }
    );

  }


  // 정답 제출
  window.submitAnswer = async function() {

    if (answered) return;

    if (currentQuestion < 0) {

      document.getElementById("submitMessage")
        .innerText =
        "아직 문제가 시작되지 않았어요.";

      return;

    }


    const input =
      document.getElementById("answerInput")
        .value.trim();


    if (!input) return;


    const answer =
      questions[currentQuestion].a;


    if (
      input.replace(/\s/g,"")
        !== answer.replace(/\s/g,"")
    ) {

      document.getElementById("submitMessage")
        .innerText =
        "❌ 땡! 다시 생각해보세요.";

      return;

    }


    answered = true;

    document.getElementById("submitButton")
      .disabled = true;


   const answerRef =
  push(ref(
    db,
    "answers/" + currentQuestion
  ));

await set(answerRef, {

  playerId: playerId,

  name: playerName,

  time: Date.now()

});


// 첫 번째 정답자를 확인하고 점수 +1
const winnerRef =
  ref(
    db,
    "winners/" + currentQuestion
  );

const result =
  await runTransaction(
    winnerRef,
    currentWinner => {

      // 아직 아무도 정답을 맞히지 않았다면
      if (currentWinner === null) {

        return {
          playerId: playerId,
          name: playerName,
          time: Date.now()
        };

      }

      // 이미 다른 사람이 정답을 맞혔다면
      return;

    }
  );


// 내가 첫 번째 정답자라면
if (result.committed) {

  const playerRef =
    ref(
      db,
      "players/" + playerId + "/score"
    );

  await runTransaction(
    playerRef,
    score => (score || 0) + 1
  );

  document.getElementById("submitMessage")
    .innerText =
    "🏆 정답! 가장 먼저 맞혔어요! +1점";

} else {

  document.getElementById("submitMessage")
    .innerText =
    "⭕ 정답! 하지만 조금 늦었어요.";

}

  };


  // 진행자 화면
  function hostMode() {

    document.getElementById("startScreen")
      .classList.add("hidden");

    document.getElementById("hostScreen")
      .classList.remove("hidden");


    onValue(
      ref(db, "game"),
      snapshot => {

        const data = snapshot.val();

        if (!data) return;


        const q =
          data.currentQuestion;


        if (
          q !== undefined &&
          q >= 0
        ) {

          document.getElementById("questionNumber")
            .innerText =
            `문제 ${q + 1} / ${questions.length}`;

          document.getElementById("hostQuestion")
            .innerText =
            questions[q].q;

          document.getElementById("hostAnswer")
            .innerText =
            "정답: " + questions[q].a;

        }

      }
    );


    onValue(
      ref(db, "players"),
      snapshot => {

        const players = snapshot.val();

        if (!players) return;


        const sorted =
          Object.values(players)
            .sort((a,b) => b.score - a.score);


        let html = "";

        sorted.forEach((p,index) => {

          html +=
            `${index + 1}위 ${p.name} — ${p.score}점<br>`;

        });


        document.getElementById("hostRanking")
          .innerHTML = html;


        document.getElementById("participants")
          .innerHTML =
          sorted.map(
            p => `👤 ${p.name}`
          ).join("<br>");

      }
    );

  }


  // 다음 문제
  window.nextQuestion = async function() {

    let next =
      currentQuestion + 1;


    if (next >= questions.length) {

      alert("20문제가 모두 끝났습니다!");

      return;

    }


    currentQuestion = next;


    await set(
      ref(db, "game"),
      {
        currentQuestion: next
      }
    );


    document.getElementById("winner")
      .innerText = "";

  };


  // 정답 보기
  window.showAnswer = function() {

    if (currentQuestion < 0) return;

    document.getElementById("hostAnswer")
      .innerText =
      "정답: " +
      questions[currentQuestion].a;

  };


  // 호스트 모드
  // 주소 뒤에 ?host 를 붙이면 진행자 화면
 if (
  window.location.search.includes("host")
) {

  hostMode();

}
</script>

</body>
</html>
