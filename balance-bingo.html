
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>밸런스 릴레이 빙고</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f5fb;
      color: #252842;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 30px auto;
      padding: 28px 22px;
      background: white;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      text-align: center;
    }

    .icon {
      font-size: 52px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 27px;
      line-height: 1.4;
    }

    .description {
      color: #70758a;
      line-height: 1.7;
      font-size: 15px;
      margin-bottom: 26px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #d9dce8;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 12px;
      outline-color: #6965dc;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #6965dc;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #b7b7c8;
      cursor: not-allowed;
    }

    .notice {
      margin-top: 20px;
      padding: 13px;
      background: #f1f0ff;
      border-radius: 12px;
      color: #55518f;
      font-size: 13px;
      line-height: 1.6;
    }

    .hidden {
      display: none;
    }

    #message {
      margin-top: 12px;
      color: #c0394b;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="container">
      <section id="hostScreen" class="hidden">
      <div class="icon">🎯</div>
      <h1>밸런스 릴레이 빙고</h1>
      <p class="description">진행자 화면</p>
      <div class="notice">
        진행자 화면이 정상적으로 열렸어요!<br>
        다음 단계에서 25개 질문 관리 기능을 추가할게요.
      </div>
    </section>

    <section id="joinScreen">
      <div class="icon">🎯</div>
      <h1>밸런스 릴레이 빙고</h1>
      <p class="description">
        나의 선택이 다음 주자를 결정한다!<br>
        25개 질문으로 즐기는 릴레이 게임
      </p>

      <input
        id="playerName"
        type="text"
        maxlength="12"
        placeholder="이름을 입력해 주세요"
        autocomplete="off"
      >

      <button id="joinButton" type="button">
        게임 참가하기
      </button>

      <div id="message" role="alert"></div>

      <div class="notice">
        진행자의 안내에 따라 참여해 주세요.<br>
        다른 참가자의 선택은 게임 시작 전까지 공개되지 않습니다.
      </div>
    </section>

    <section id="waitingScreen" class="hidden">
      <div class="icon">🙌</div>
      <h1>참가 준비 완료!</h1>
      <p class="description">
        <strong id="welcomeName"></strong>님, 반가워요!<br>
        진행자가 게임을 시작할 때까지 기다려 주세요.
      </p>
      <div class="notice">
        현재는 화면 확인을 위한 임시 기능입니다.<br>
        Firebase 연결 후 실제 참가 기능이 작동하도록 만들 예정입니다.
      </div>
    </section>
  </main>

  
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getDatabase,
    ref,
    set
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  import {
    getAuth,
    signInAnonymously
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyByHNWVZ0ymrspwOgoG6q2XgXPpPqvRBBc",
    authDomain: "balance-relay-bingo.firebaseapp.com",
    databaseURL: "https://balance-relay-bingo-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "balance-relay-bingo",
    storageBucket: "balance-relay-bingo.firebasestorage.app",
    messagingSenderId: "1088440127318",
    appId: "1:1088440127318:web:f84331bd766a9957a6d0f7"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);
const isHost = new URLSearchParams(window.location.search).has("host");
document.title = isHost ? "밸런스 릴레이 빙고 - 진행자" : "밸런스 릴레이 빙고";
    if (isHost) {
    document.getElementById("joinScreen").classList.add("hidden");
    document.getElementById("waitingScreen").classList.add("hidden");
    document.getElementById("hostScreen").classList.remove("hidden");
  }

  const nameInput = document.getElementById("playerName");
  const joinButton = document.getElementById("joinButton");
  const message = document.getElementById("message");

  joinButton.addEventListener("click", async () => {
    const name = nameInput.value.trim();

    if (!name) {
      message.textContent = "이름을 먼저 입력해 주세요.";
      nameInput.focus();
      return;
    }

    joinButton.disabled = true;
    message.textContent = "참가 정보를 준비하고 있어요.";

    try {
      const credential = await signInAnonymously(auth);
      const playerId = credential.user.uid;

      await set(ref(db, "testConnection/" + playerId), {
        name: name,
        joinedAt: Date.now()
      });

      document.getElementById("welcomeName").textContent = name;
      document.getElementById("joinScreen").classList.add("hidden");
      document.getElementById("waitingScreen").classList.remove("hidden");
      message.textContent = "";
    } catch (error) {
      console.error("Firebase 연결 오류:", error);
      message.textContent =
        "저장에 실패했어요. 다음 단계에서 데이터베이스 규칙을 설정할게요.";
      joinButton.disabled = false;
    }
  });

  nameInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      joinButton.click();
    }
  });
</script>

</body>
</html>
