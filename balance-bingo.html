
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>밸런스 릴레이 빙고</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f4f5fb;
      color: #252842;
    }
    .container {
      max-width: 650px;
      margin: 20px auto;
      padding: 22px 16px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 30px #0000000d;
    }
    h1 { font-size: 25px; text-align: center; }
    h2 { font-size: 20px; }
    .description {
      color: #70758a;
      line-height: 1.7;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d9dce8;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 12px;
    }
    button {
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #6965dc;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .main-button { width: 100%; margin-top: 14px; }
    .hidden { display: none !important; }
    .notice {
      padding: 13px;
      margin-top: 15px;
      background: #f1f0ff;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
    }
    #message, #questionMessage {
      margin-top: 12px;
      color: #b42336;
      font-size: 14px;
    }
    .question-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .question-card {
      min-width: 0;
      padding: 11px;
      border: 1px solid #e0e2ed;
      border-radius: 13px;
      background: #fff;
    }
    .question-title {
      min-height: 43px;
      font-size: 14px;
      font-weight: bold;
      line-height: 1.5;
      margin-bottom: 9px;
    }
    .choices { display: grid; gap: 6px; }
    .choice {
      width: 100%;
      padding: 9px 7px;
      color: #383957;
      background: #f3f4f9;
      border: 1px solid #e0e2ed;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .choice.selected {
      background: #6965dc;
      color: white;
      border-color: #6965dc;
    }
    .counter {
      text-align: center;
      font-weight: bold;
      margin: 15px 0;
    }
    .player-row {
      padding: 10px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }
    @media (max-width: 360px) {
      .question-grid { gap: 6px; }
      .question-card { padding: 8px; }
      .question-title { font-size: 13px; }
      .choice { font-size: 12px; }
    }
  </style>
</head>
<body>
<main class="container">

  <section id="joinScreen">
    <h1>🎯 밸런스 릴레이 빙고</h1>
    <p class="description">
      25개 질문에 답을 선택하고<br>
      진행자의 게임 시작을 기다려 주세요!
    </p>
    <input id="playerName" maxlength="12"
      placeholder="이름을 입력해 주세요" autocomplete="off">
    <button id="joinButton" class="main-button">게임 참가하기</button>
    <div id="message" role="alert"></div>
  </section>

  <section id="questionScreen" class="hidden">
    <h1>🎯 밸런스 릴레이 빙고</h1>
    <p class="description">
      각 질문에서 A 또는 B를 선택해 주세요.
    </p>
    <div id="welcomeName" class="counter"></div>
    <div id="questionCounter" class="counter">선택 0 / 25</div>
    <div id="questionGrid" class="question-grid"></div>
    <button id="submitButton" class="main-button" disabled>
      답변 제출하기
    </button>
    <div id="questionMessage" role="status"></div>
  </section>

  <section id="waitingScreen" class="hidden">
    <h1>🙌 제출 완료!</h1>
    <p class="description" id="waitingText">
      진행자가 게임을 시작할 때까지 기다려 주세요.
    </p>
  </section>

  <section id="hostScreen" class="hidden">
    <h1>🎯 진행자 화면</h1>
    <p class="description">
      참가자들의 제출 현황을 확인할 수 있어요.
    </p>
    
    <h2>참가 현황</h2>
    <p id="hostCount">참가 현황을 불러오는 중...</p>
    <div id="playerList"></div>
    <button id="startButton" class="main-button">
      게임 시작하기
    </button>
    <div id="hostMessage" class="notice" role="status">
      데이터베이스 규칙을 설정한 후 사용할 수 있어요.
    </div>
    <section id="revealedAnswers" class="hidden">
      <h2>제출된 답변</h2>
      <p class="description">
        게임 시작 후에만 답변을 확인할 수 있어요.
      </p>
      <div id="answerList"></div>
    </section>
  </section>

</main>

<script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getDatabase, ref, set, update, onValue
  } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  import {
    getAuth, signInAnonymously
  } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyByHNWVZ0ymrspwOgoG6q2XgXPpPqvRBBc",
    authDomain: "balance-relay-bingo.firebaseapp.com",
    databaseURL: "https://balance-relay-bingo-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "balance-relay-bingo",
    storageBucket: "balance-relay-bingo.firebasestorage.app",
    messagingSenderId: "1088440127318",
    appId: "1:1088440127318:web:f84331bd766a9957a6d0f7"
  };

  const questions = [
    ["🍚 밥", "🥖 빵"],
    ["🌊 바다", "🏔️ 산"],
    ["☀️ 여름", "❄️ 겨울"],
    ["🏠 집콕", "🚗 외출"],
    ["🎬 영화관", "📺 집에서 영화 보기"],
    ["📱 전화", "💬 문자"],
    ["💰 지금 100만 원 받기", "🎰 50% 확률로 300만 원 받기"],
    ["🍳 반숙 계란", "🥚 완숙 계란"],
    ["⏰ 알람 한 번에 기상", "⏰ 여러 번 알람"],
    ["🪟 창가 자리", "🚪 출입문 가까운 자리"],
    ["🍗 뼈 있는 치킨", "🍗 순살 치킨"],
    ["🍜 라면에 계란 넣기", "🥚 계란 없이 먹기"],
    ["🍕 끝부분까지 먹기", "🧀 끝부분 남기기"],
    ["🍫 단짠 조합", "🌶️ 맵단 조합"],
    ["🍳 좋아하는 음식 먼저 먹기", "🍳 마지막에 먹기"],
    ["🛏️ 주말 늦잠 자기", "🌄 평소처럼 일찍 일어나기"],
    ["🚿 샤워 먼저", "🪥 양치 먼저"],
    ["📺 드라마 몰아보기", "📅 매주 한 편씩 보기"],
    ["🛍️ 필요한 것만 사기", "🛒 구경하다 충동구매"],
    ["🧳 여행 짐 미리 싸기", "🧳 출발 전날 몰아서 싸기"],
    ["🧊 에어컨 강하게 틀기", "🌬️ 선풍기로 버티기"],
    ["🧠 고민 생기면 바로 말하기", "🤔 혼자 생각한 뒤 말하기"],
    ["💬 메시지 오면 바로 답장", "💬 여유 있을 때 답장"],
    ["🎁 원하는 선물을 정확히 받기", "🎉 예상 못 한 깜짝 선물 받기"],
    ["🔮 미래를 미리 알기", "🔄 과거의 선택 한 번 바꾸기"]
  ];

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);
  const isHost = new URLSearchParams(location.search).has("host");

  const $ = (id) => document.getElementById(id);
  let user = null;
  let playerName = "";
  let choices = Array(25).fill(null);
  let submitted = false;

  function showScreen(id) {
    ["joinScreen", "questionScreen", "waitingScreen", "hostScreen"]
      .forEach(screen => $(screen).classList.add("hidden"));
    $(id).classList.remove("hidden");
  }

  function showError(id, error) {
    console.error(error);
    $(id).textContent =
      "연결에 실패했어요. 데이터베이스 규칙 설정을 확인해 주세요.";
  }

  function renderQuestions() {
    const grid = $("questionGrid");
    grid.replaceChildren();

    questions.forEach((question, index) => {
      const card = document.createElement("div");
      card.className = "question-card";

      const title = document.createElement("div");
      title.className = "question-title";
      title.textContent = `${index + 1}. ${question[0]} vs ${question[1]}`;
      card.appendChild(title);

      const choicesBox = document.createElement("div");
      choicesBox.className = "choices";

      question.forEach((answer, optionIndex) => {
        const button = document.createElement("button");
        button.className = "choice";
        button.textContent = `${optionIndex === 0 ? "A" : "B"} · ${answer}`;
        button.type = "button";

        button.addEventListener("click", () => {
          if (submitted) return;
          choices[index] = optionIndex;
          renderQuestions();
        });

        if (choices[index] === optionIndex) {
          button.classList.add("selected");
        }
        choicesBox.appendChild(button);
      });

      card.appendChild(choicesBox);
      grid.appendChild(card);
    });

    const count = choices.filter(value => value !== null).length;
    $("questionCounter").textContent = `선택 ${count} / 25`;
    $("submitButton").disabled = count !== 25 || submitted;
  }

  async function startApp() {
    try {
      const credential = await signInAnonymously(auth);
      user = credential.user;

      if (isHost) {
        showScreen("hostScreen");
        $("hostUidDisplay").textContent = user.uid;
        $("hostMessage").textContent =
          "인증은 완료됐어요. 다음 단계에서 데이터베이스 규칙을 설정할게요.";

        onValue(ref(db, "players"), snapshot => {
          const players = snapshot.val() || {};
          const list = Object.values(players);
          const completed = list.filter(p => p.submitted).length;
          $("hostCount").textContent =
            `참가 ${list.length}명 · 제출 완료 ${completed}명`;

          const playerList = $("playerList");
          playerList.replaceChildren();

          list.forEach(player => {
            const row = document.createElement("div");
            row.className = "player-row";
            row.textContent =
              `${player.name} · ${player.submitted ? "제출 완료" : "답변 작성 중"}`;
            playerList.appendChild(row);
          });
        }, error => showError("hostMessage", error));

        onValue(ref(db, "game/status"), snapshot => {
          if (snapshot.val() === "started") {
            $("hostMessage").textContent = "게임이 시작됐어요!";
            $("startButton").disabled = true;
            $("revealedAnswers").classList.remove("hidden");

            onValue(ref(db, "answers"), answerSnapshot => {
              const answers = answerSnapshot.val() || {};
              const answerList = $("answerList");
              answerList.replaceChildren();

              Object.values(answers).forEach(entry => {
                const row = document.createElement("div");
                row.className = "player-row";
                row.textContent = `${entry.name}: ` +
                  entry.choices.map((choice, i) =>
                    `${i + 1}.${choice === 0 ? "A" : "B"}`
                  ).join(" / ");
                answerList.appendChild(row);
              });
            }, error => showError("hostMessage", error));
          }
        }, error => showError("hostMessage", error));

        $("startButton").addEventListener("click", async () => {
          try {
            await set(ref(db, "game/status"), "started");
            $("hostMessage").textContent = "게임 시작 신호를 보냈어요!";
          } catch (error) {
            showError("hostMessage", error);
          }
        });
        return;
      }

      showScreen("joinScreen");

      $("joinButton").addEventListener("click", async () => {
        const name = $("playerName").value.trim();
        if (!name) {
          $("message").textContent = "이름을 먼저 입력해 주세요.";
          return;
        }

        playerName = name;
        $("joinButton").disabled = true;

        try {
          await set(ref(db, "players/" + user.uid), {
            name: playerName,
            joinedAt: Date.now(),
            submitted: false
          });

          $("welcomeName").textContent = `${playerName}님`;
          renderQuestions();
          showScreen("questionScreen");
          $("message").textContent = "";
        } catch (error) {
          showError("message", error);
        } finally {
          $("joinButton").disabled = false;
        }
      });

      $("playerName").addEventListener("keydown", event => {
        if (event.key === "Enter") $("joinButton").click();
      });

      $("submitButton").addEventListener("click", async () => {
        if (choices.some(value => value === null) || submitted) return;

        $("submitButton").disabled = true;
        $("questionMessage").textContent = "답변을 제출하고 있어요.";

        try {
          await set(ref(db, "answers/" + user.uid), {
            name: playerName,
            choices: choices,
            submittedAt: Date.now()
          });

          await update(ref(db, "players/" + user.uid), {
            submitted: true
          });

          submitted = true;
          showScreen("waitingScreen");

          onValue(ref(db, "game/status"), snapshot => {
            if (snapshot.val() === "started") {
              $("waitingText").textContent =
                "게임이 시작됐어요! 진행자의 안내를 따라 주세요.";
            }
          });
        } catch (error) {
          $("submitButton").disabled = false;
          showError("questionMessage", error);
        }
      });

    } catch (error) {
      console.error(error);
      if (isHost) {
        showScreen("hostScreen");
        $("hostMessage").textContent =
          "인증에 실패했어요. 페이지를 새로고침해 주세요.";
      } else {
        $("message").textContent =
          "인증에 실패했어요. 페이지를 새로고침해 주세요.";
      }
    }
  }

  startApp();
</script>
</body>
</html>

</body>
</html>
